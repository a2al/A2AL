# Example a2ald configuration
#
# Location: <data-dir>/config.toml (override: a2ald -config PATH).
# Missing file: daemon writes a default on first start.

# ---- Network ----
# Wildcard ":4121" is dual-stack (IPv4 + IPv6). "1.2.3.4:4121" is IPv4-only.

listen_addr = ":4121"

# Empty: DHT and QUIC share one UDP port. Non-empty: separate QUIC bind.
quic_listen_addr = ""

# Seed peers as host:port (not multiaddrs). Empty = public Tangled Network.
# Non-empty skips public DNS. Example private cluster:
#   bootstrap = ["192.168.1.10:4121"]
bootstrap = []

min_observed_peers = 3
fallback_host = ""
disable_upnp = false

# Optional: require bootstrap peers' NodeIDs to match this list (hex).
# bootstrap_node_ids = ["…"]

# ---- HTTP API / Web UI ----

api_addr = "127.0.0.1:2121"
api_token = ""
# true: Bearer required even on loopback (shared/multi-user hosts).
require_local_token = false
# Headless / service installs typically set this false (or pass --no-open-browser).
open_browser = true

# ---- Keys / objects ----

key_dir = ""
# Sandbox for object bytes uploaded to the daemon (CAS POST, group_object_put body_base64).
# Empty: path-based object registration has no extra directory constraint.
# files_root = "/var/lib/a2al/files"

# ---- Logging ----

log_format = "text"    # text | json
log_level = "info"     # debug | info | warn | error
# log_debug_components = ["ice", "punch", "natsense"]

# ---- ICE / TURN (restart after listen/signal/TURN changes) ----

ice_signal_url = ""
ice_signal_urls = []
ice_stun_urls = []

# Legacy turn:user:pass@host — prefer [[turn_servers]].
ice_turn_urls = []

# External TURN only. Credentials never published to the DHT.
# credential_type: static | hmac | rest_api

# [[turn_servers]]
# url = "turn:turn.example.com:3478?transport=udp"
# username = "alice"
# credential = "s3cr3t"

# [[turn_servers]]
# url = "turn:coturn.example.com:3478"
# credential_type = "hmac"
# username = "a2ald"
# credential = "<coturn use-auth-secret>"

# [[turn_servers]]
# url = "turn:global.turn.twilio.com:3478?transport=udp"
# credential_type = "rest_api"
# credential_url = "https://api.twilio.com/2010-04-01/Accounts/ACxxx/Tokens.json"
# credential = "Basic base64(AccountSID:AuthToken)"

disable_relay = false

# Embedded ICE hub TCP. Empty = same port as listen_addr. "off" = disable.
signal_listen_addr = ""

auto_publish = true

# Prefer last-known good UDP path before ICE. false = legacy blind UDP.
learned_path_first = true

# Deprecated: new nodes do not publish turns[] on the DHT.
# ice_publish_turns = []

# ---- Updates ----

[update]
auto = true
